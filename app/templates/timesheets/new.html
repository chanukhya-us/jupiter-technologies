{% extends 'base.html' %}
{% block title %}New Timesheet - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Timesheet</h1>
<form method="post" action="{{ url_for('timesheets.create_timesheet') }}" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Employee</label><select class="form-select" name="employee_id" required>{% for employee in employees %}<option value="{{ employee.id }}">{{ employee.full_name }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Week start</label><input class="form-control" type="date" name="week_start" required /></div>
    <div class="col-md-3"><label class="form-label">Week end</label><input class="form-control" type="date" name="week_end" required /></div>
    <div class="col-md-2"><label class="form-label">Hours</label><input class="form-control" type="number" step="0.1" name="total_hours" required /></div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Create Timesheet</button></div>
</form>
{% endblock %}
