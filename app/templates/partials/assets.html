{% macro render_asset_image(asset, alt=None, decorative=False, class_name='', loading='lazy', fetchpriority=None, width=None, height=None) -%}
{% if asset %}
<img
  src="{{ url_for('static', filename=asset['static_path']) }}"
  class="{{ class_name }}"
  {% if decorative %}
  alt=""
  aria-hidden="true"
  {% else %}
  alt="{{ alt or asset['alt'] or 'Jupiter Technologies image' }}"
  {% endif %}
  loading="{{ loading }}"
  decoding="async"
  {% if fetchpriority %}fetchpriority="{{ fetchpriority }}"{% endif %}
  {% if width or asset['width'] %}width="{{ width or asset['width'] }}"{% endif %}
  {% if height or asset['height'] %}height="{{ height or asset['height'] }}"{% endif %}
/>
{% endif %}
{%- endmacro %}
