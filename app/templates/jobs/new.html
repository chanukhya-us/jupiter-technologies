{% extends 'base.html' %}
{% block title %}New Job - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Job</h1>
<form method="post" action="{{ url_for('jobs.create_job') }}" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" required /></div>
    <div class="col-md-3"><label class="form-label">Job code</label><input class="form-control" name="job_code" /></div>
    <div class="col-md-3"><label class="form-label">Client</label><select class="form-select" name="client_id" required>{% for client in clients %}<option value="{{ client.id }}">{{ client.company_name }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="status">{% for status in job_statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Owner</label><select class="form-select" name="owner_user_id"><option value="">--</option>{% for recruiter in recruiters %}<option value="{{ recruiter.id }}">{{ recruiter.full_name }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Work type</label><input class="form-control" name="work_type" /></div>
    <div class="col-md-3"><label class="form-label">Employment type</label><input class="form-control" name="employment_type" /></div>
    <div class="col-md-3"><label class="form-label">Location</label><input class="form-control" name="location" /></div>
    <div class="col-md-3"><label class="form-label">Min exp</label><input class="form-control" type="number" step="0.1" name="min_experience" /></div>
    <div class="col-md-3"><label class="form-label">Max exp</label><input class="form-control" type="number" step="0.1" name="max_experience" /></div>
    <div class="col-md-6"><label class="form-label">Salary / Rate</label><input class="form-control" name="salary_or_rate" /></div>
    <div class="col-md-12"><label class="form-label">Required skills</label><textarea class="form-control" name="required_skills" rows="2"></textarea></div>
    <div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Create Job</button></div>
</form>
{% endblock %}
