{% extends 'base.html' %}
{% block title %}New Candidate - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Candidate</h1>
<form method="post" action="{{ url_for('candidates.create_candidate') }}" enctype="multipart/form-data" class="card card-body">
  {% set candidate = None %}
  {% include 'candidates/_form.html' %}
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Create Candidate</button>
  </div>
</form>
{% endblock %}
