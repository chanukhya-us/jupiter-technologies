{% extends 'base.html' %}
{% block title %}Edit Candidate - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit Candidate</h1>
<form method="post" action="{{ url_for('candidates.update_candidate', candidate_id=candidate.id) }}" enctype="multipart/form-data" class="card card-body">
  {% include 'candidates/_form.html' %}
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save Changes</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('candidates.candidate_detail', candidate_id=candidate.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
