{% extends 'base.html' %}
{% block title %}New Client - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Client</h1>
<form method="post" action="{{ url_for('clients.create_client') }}" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Company name</label>
      <input class="form-control" name="company_name" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">Client code</label>
      <input class="form-control" name="client_code" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Contact person</label>
      <input class="form-control" name="contact_person" />
    </div>
    <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" name="email" /></div>
    <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" /></div>
    <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="is_active"><option value="1">Active</option><option value="0">Inactive</option></select></div>
    <div class="col-md-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2"></textarea></div>
    <div class="col-md-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Create Client</button></div>
</form>
{% endblock %}
