{% extends 'base.html' %}
{% block title %}New Marketer Log - Jupiter Technologies{% endblock %}
{% block content %}
<div class="rt-page-header">
  <div>
    <h1 class="rt-page-title">New Marketer Log</h1>
    <p class="rt-subtitle">Capture daily marketer activities and submit before cutoff.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ url_for('marketer_activity.list_logs') }}">Back</a>
</div>

<div class="rt-card">
  <form class="row g-3" method="post" action="{{ url_for('marketer_activity.create_log') }}">
    <div class="col-md-4">
      <label class="form-label">Marketer</label>
      <select class="form-select" name="marketer_user_id" {% if not is_admin %}disabled{% endif %}>
        {% for marketer in marketers %}
        <option value="{{ marketer.id }}" {% if form_data.marketer_user_id == marketer.id %}selected{% endif %}>{{ marketer.full_name }}</option>
        {% endfor %}
      </select>
      {% if not is_admin %}<input type="hidden" name="marketer_user_id" value="{{ form_data.marketer_user_id }}" />{% endif %}
    </div>
    <div class="col-md-4">
      <label class="form-label">Log Date</label>
      <input class="form-control" type="date" name="log_date" value="{{ form_data.log_date }}" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Job Type</label>
      <select class="form-select" name="job_type">
        {% for job_type in marketer_job_types %}
        <option value="{{ job_type }}" {% if form_data.job_type == job_type %}selected{% endif %}>{{ job_type }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3"><label class="form-label">Jobs Applied</label><input class="form-control" type="number" min="0" name="jobs_applied" value="{{ form_data.jobs_applied }}" /></div>
    <div class="col-md-3"><label class="form-label">Follow-ups</label><input class="form-control" type="number" min="0" name="follow_ups" value="{{ form_data.follow_ups }}" /></div>
    <div class="col-md-3"><label class="form-label">Interviews Scheduled</label><input class="form-control" type="number" min="0" name="interviews_scheduled" value="{{ form_data.interviews_scheduled }}" /></div>
    <div class="col-md-3"><label class="form-label">Pay Discussions</label><input class="form-control" type="number" min="0" name="pay_discussions" value="{{ form_data.pay_discussions }}" /></div>

    <div class="col-md-4"><label class="form-label">Hourly Rate Min</label><input class="form-control" type="number" step="0.01" min="0" name="hourly_rate_min" value="{{ form_data.hourly_rate_min }}" /></div>
    <div class="col-md-4"><label class="form-label">Hourly Rate Max</label><input class="form-control" type="number" step="0.01" min="0" name="hourly_rate_max" value="{{ form_data.hourly_rate_max }}" /></div>
    <div class="col-md-4"><label class="form-label">Project Duration (Weeks)</label><input class="form-control" type="number" min="0" name="project_duration_weeks" value="{{ form_data.project_duration_weeks }}" /></div>

    <div class="col-12">
      <label class="form-label">Notes</label>
      <textarea class="form-control" rows="4" name="notes" placeholder="Required when all counts are zero.">{{ form_data.notes }}</textarea>
    </div>

    <div class="col-12 d-flex justify-content-end gap-2">
      <button class="btn btn-outline-primary" type="submit">Save Draft</button>
      <button class="btn btn-primary" type="submit" name="submit_now" value="1">Save & Submit</button>
    </div>
  </form>
</div>
{% endblock %}
