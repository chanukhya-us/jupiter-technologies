{% extends 'base.html' %}
{% block title %}New Submission - Jupiter Technologies{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Submission</h1>
<form method="post" action="{{ url_for('submissions.create_submission') }}" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Candidate</label><select class="form-select" name="candidate_id" required>{% for candidate in candidates %}<option value="{{ candidate.id }}">{{ candidate.full_name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Job</label><select class="form-select" name="job_id" required>{% for job in jobs %}<option value="{{ job.id }}">{{ job.title }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Recruiter</label><select class="form-select" name="recruiter_user_id">{% for recruiter in recruiters %}<option value="{{ recruiter.id }}">{{ recruiter.full_name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{% for status in submission_statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Interview date</label><input class="form-control" type="datetime-local" name="interview_date" /></div>
    <div class="col-md-12"><label class="form-label">Feedback</label><textarea class="form-control" name="feedback" rows="3"></textarea></div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Create Submission</button></div>
</form>
{% endblock %}
