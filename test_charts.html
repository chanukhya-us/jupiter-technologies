<!DOCTYPE html>
<html>
<head>
    <title>Chart Test</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            background: #f5f7fa;
        }
        .chart-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        canvas {
            max-width: 100%;
        }
        .donut-container {
            width: 300px;
            height: 300px;
        }
        .line-container {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Jupiter Charts Test</h1>
    
    <div class="chart-container">
        <h2>Donut Chart Test</h2>
        <div class="donut-container">
            <canvas 
                class="rt-donut-chart"
                data-labels='["Active", "Pending", "Completed", "Rejected"]'
                data-values='[25, 15, 40, 10]'
                data-total="90"
            ></canvas>
        </div>
    </div>

    <div class="chart-container">
        <h2>Line Chart Test</h2>
        <div class="line-container">
            <canvas 
                class="rt-series-chart"
                data-chart-type="line"
                data-labels='["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]'
                data-datasets='[{
                    "label": "Candidates",
                    "data": [12, 19, 15, 25, 22, 18, 20],
                    "borderColor": "#0f62fe",
                    "backgroundColor": "rgba(15, 98, 254, 0.1)",
                    "fill": true
                }]'
            ></canvas>
        </div>
    </div>

    <div class="chart-container">
        <h2>Bar Chart Test</h2>
        <div class="line-container">
            <canvas 
                class="rt-series-chart"
                data-chart-type="bar"
                data-labels='["Jan", "Feb", "Mar", "Apr", "May"]'
                data-datasets='[{
                    "label": "Jobs",
                    "data": [5, 8, 12, 7, 15],
                    "backgroundColor": "#24a148"
                }]'
            ></canvas>
        </div>
    </div>

    <script src="http://127.0.0.1:5001/static/vendor/chart.umd.min.js"></script>
    <script src="http://127.0.0.1:5001/static/js/charts.js"></script>
</body>
</html>
